<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenZFS for Windows</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<header class="titlebar">
  <span class="logo" aria-hidden="true"></span>
  <span class="app-name">OpenZFS for Windows</span>
  <div class="context" id="context">
    <label for="pool-select">Pool</label>
    <select id="pool-select" data-change="pool"></select>
    <span id="pool-chip"></span>
  </div>
  <div class="titlebar-end">
    <button type="button" class="btn ghost" data-act="refresh">Refresh</button>
    <button type="button" class="btn ghost" data-act="report-save">Save report</button>
    <span class="edition" id="edition"></span>
  </div>
</header>
<nav class="side" aria-label="Sections">
  <button type="button" data-view="overview">Overview</button>
  <button type="button" data-view="datasets">Datasets</button>
  <button type="button" data-view="snapshots">Snapshots</button>
  <button type="button" data-view="devices">Devices <span class="badge" data-badge="devices" hidden></span></button>
  <button type="button" data-view="health">Health &amp; scrub <span class="badge" data-badge="health" hidden></span></button>
  <button type="button" data-view="performance">Performance</button>
  <div class="sep" role="presentation"></div>
  <button type="button" data-view="service">User-mode service</button>
  <div class="versions" id="versions"></div>
</nav>
<main id="view" tabindex="-1"></main>
<footer class="statusbar">
  <span class="live" id="live">Connecting…</span>
  <span id="status" role="status"></span>
</footer>
<div id="toasts" aria-live="polite"></div>
</body>
</html>
