# Build and VM test suites on self-hosted runners (docs/ci-runners.md).
# GitHub-hosted runners have neither the WDK and test-signing certificate
# nor Hyper-V for the test VMs, so every job runs on one of our machines:
#   label zfswin-x64:   builds both architectures, runs the x64 unit tests
#                       and the x64 VM integration tests
#   label zfswin-arm64: runs the ARM64 unit tests and VM integration tests
#                       on the ARM PC
# Packages: a push to master (a merged pull request) and a manual run on
# master build Release and Debug, and a push to master also publishes them
# as the GitHub release v<version>, which the README links to.  Pull
# requests and manual runs on other branches build Debug only (plus Release
# when the VM integration tests are asked to run on Release).  Packages are
# never committed (downloads/ is ignored).
# The x64 unit tests (the user-mode engine on image files, no VM) run on
# every build; their results are the build job's summary page.  Coverage
# (an instrumented engine, its own job and summary page, the HTML report as
# an artifact) runs on every push to master and on demand.  The ARM64 unit
# tests and the VM integration tests are disabled for pushes and pull
# requests: they run only on demand (Run workflow with "Run the ARM64 unit
# tests" or "Run the VM integration tests" ticked).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      configuration:
        description: Configuration of the packages under test
        type: choice
        options: [Release, Debug]
        default: Release
      vm-integration-tests:
        description: Run the VM integration tests after the build
        type: boolean
        default: false
      arm64-unit-tests:
        description: Run the ARM64 unit tests after the build
        type: boolean
        default: false
      coverage:
        description: Measure the unit tests' code coverage after the build
        type: boolean
        default: false
      clean:
        description: Clean build (discard the runner's kept build trees)
        type: boolean
        default: false

# One run per branch at a time; a newer push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CONFIGURATION: ${{ inputs.configuration || 'Release' }}

# Every run step uses Windows PowerShell with -ExecutionPolicy Bypass: on a
# client SKU the default policy (Restricted) refuses the step's own script.

jobs:
  # Both architectures with the driver, one artifact per architecture and
  # configuration (see the top of this file for which configurations).
  # out\ stays in this runner's workspace, for vm-integration-x64 and as
  # the next run's incremental build trees.
  build:
    runs-on: [self-hosted, Windows, X64, zfswin-x64]
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    outputs:
      version: ${{ steps.version.outputs.version }}
      test-configuration: ${{ steps.plan.outputs.test-configuration }}
    steps:
      # Submodules in the "Submodules" step: checkout would force them back
      # to the pinned commit every run.
      - uses: actions/checkout@v5
        with:
          clean: false

      # Everything but out\, whose Ninja build trees make the compile
      # incremental; the previous run's packages are dropped.  The "clean"
      # input discards out\ as well.
      - name: Clean workspace
        run: |
          git reset -q --hard
          git clean -qffdx -e /out/
          $drop = if ('${{ inputs.clean }}' -eq 'true') { @("out") } else { @("out\release", "out\installer-payload", "out\installer-build", "out\logs") }
          foreach ($d in $drop) { if (Test-Path $d) { Remove-Item -Recurse -Force $d } }

      # The patches touch headers nearly every driver file includes
      # (isa_defs.h), so re-applying them recompiles the whole driver.  The
      # submodules are reset (and the patches re-applied by the build) only
      # when the pinned commits or the patches differ from the last
      # successful build's, recorded in out\ci-submodules.stamp.
      - name: Submodules
        id: submodules
        run: |
          $state = (@(git ls-tree -r HEAD | Where-Object { $_ -like "160000 *" }) +
              @(Get-ChildItem patches -Recurse -File | Sort-Object FullName | Get-FileHash | ForEach-Object Hash)) -join "`n"
          $hash = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([Text.Encoding]::UTF8.GetBytes($state))) -replace '-'
          $stamp = "out\ci-submodules.stamp"
          if ((Test-Path $stamp) -and (Get-Content $stamp -Raw).Trim() -eq $hash) {
              Write-Host "Submodules and patches unchanged: kept as patched."
          } else {
              if (Test-Path $stamp) { Remove-Item $stamp }
              git submodule foreach --recursive "git reset -q --hard; git clean -qffdx"
          }
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
          if ($LASTEXITCODE -ne 0) { throw "git submodule update failed." }
          "state=$hash" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      # Every run its own version: the committed build number plus the run
      # number, written to the workspace only (the next checkout resets it).
      - name: Build number
        run: |
          $file = (Resolve-Path build\BUILD_NUMBER).Path
          $n = [int]((Get-Content $file -Raw).Trim()) + ${{ github.run_number }}
          [IO.File]::WriteAllText($file, "$n`n")

      - name: Version
        id: version
        run: '"version=$(& scripts\Get-ZfsWinVersion.ps1)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT'

      # Release and Debug on master; Debug elsewhere, plus Release for VM
      # integration tests on Release.  The unit tests use the Release engine
      # when there is one.
      - name: Configurations
        id: plan
        run: |
          $master = '${{ github.ref }}' -eq 'refs/heads/master' -and '${{ github.event_name }}' -ne 'pull_request'
          $releaseVm = '${{ inputs.vm-integration-tests }}' -eq 'true' -and '${{ inputs.configuration }}' -eq 'Release'
          $configurations = if ($master -or $releaseVm) { "Release,Debug" } else { "Debug" }
          $test = if ($configurations -like "Release*") { "Release" } else { "Debug" }
          Write-Host "Configurations: $configurations; unit tests on $test"
          "configurations=$configurations", "test-configuration=$test" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: WinFsp SDK
        run: scripts\fetch-winfsp.ps1

      # No ICE validation in CI.  An array, not "Release,Debug": the step
      # runs the script with -Command, where ValidateSet sees the joined
      # string before the script splits it.  -Parallel: one lane per
      # architecture and configuration, their logs grouped in the step's
      # output and kept in out\logs.
      - name: Build
        run: |
          $configurations = '${{ steps.plan.outputs.configurations }}' -split ','
          scripts\build-release.ps1 -NoIncrement -BuildDriver -NoValidation -Parallel -Configuration $configurations

      - name: Upload build logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v6
        with:
          name: build-logs-${{ steps.version.outputs.version }}
          path: out/logs
          if-no-files-found: ignore

      - name: Record submodule state
        run: Set-Content -Encoding ascii out\ci-submodules.stamp '${{ steps.submodules.outputs.state }}'

      # The user-mode engine in the test process, on image files.
      - name: Unit tests (x64)
        run: scripts\test-usermode.ps1 -Architecture x64 -Configuration ${{ steps.plan.outputs.test-configuration }}

      - name: Upload x64 unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results-x64-${{ steps.version.outputs.version }}
          path: out/test-results/usermode-x64-${{ steps.plan.outputs.test-configuration == 'Release' && 'release' || 'debug' }}
          if-no-files-found: ignore

      # The ARM64 engine for unit-tests-arm64, which cannot run it here.
      - name: Upload ARM64 unit test engine
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.arm64-unit-tests }}
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-engine-arm64-${{ steps.version.outputs.version }}
          path: out/openzfs-write-${{ steps.plan.outputs.test-configuration == 'Release' && 'release' || 'debug' }}-arm64/zfs-um-test/ZfsUserModeTest.dll
          if-no-files-found: error

      # Release file names are plain, Debug ones end in -debug; the test
      # certificate, VERSION.json and SHA256SUMS (of every package of the
      # run) go with every artifact.  MSIs are compressed already, so the
      # upload stores them as they are.
      - name: Upload x64 Release
        if: ${{ contains(steps.plan.outputs.configurations, 'Release') }}
        uses: actions/upload-artifact@v6
        with:
          name: OpenZFS-for-Windows-${{ steps.version.outputs.version }}-x64-release
          path: |
            out/release/${{ steps.version.outputs.version }}/OpenZFS-for-Windows-${{ steps.version.outputs.version }}-x64-testsigned.msi
            out/release/${{ steps.version.outputs.version }}/OpenZFS-for-Windows-${{ steps.version.outputs.version }}-x64-usermode.msi
            out/release/${{ steps.version.outputs.version }}/OpenZFS-for-Windows-${{ steps.version.outputs.version }}-x64.cdx.json
            out/release/${{ steps.version.outputs.version }}/zfswindows-test.cer
            out/release/${{ steps.version.outputs.version }}/VERSION.json
            out/release/${{ steps.version.outputs.version }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

      - name: Upload x64 Debug
        uses: actions/upload-artifact@v6
        with:
          name: OpenZFS-for-Windows-${{ steps.version.outputs.version }}-x64-debug
          path: |
            out/release/${{ steps.version.outputs.version }}/OpenZFS-for-Windows-${{ steps.version.outputs.version }}-x64-testsigned-debug.msi
            out/release/${{ steps.version.outputs.version }}/OpenZFS-for-Windows-${{ steps.version.outputs.version }}-x64-usermode-debug.msi
            out/release/${{ steps.version.outputs.version }}/OpenZFS-for-Windows-${{ steps.version.outputs.version }}-x64-debug.cdx.json
            out/release/${{ steps.version.outputs.version }}/zfswindows-test.cer
            out/release/${{ steps.version.outputs.version }}/VERSION.json
            out/release/${{ steps.version.outputs.version }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

      - name: Upload ARM64 Release
        if: ${{ contains(steps.plan.outputs.configurations, 'Release') }}
        uses: actions/upload-artifact@v6
        with:
          name: OpenZFS-for-Windows-${{ steps.version.outputs.version }}-arm64-release
          path: |
            out/release/${{ steps.version.outputs.version }}/OpenZFS-for-Windows-${{ steps.version.outputs.version }}-arm64-testsigned.msi
            out/release/${{ steps.version.outputs.version }}/OpenZFS-for-Windows-${{ steps.version.outputs.version }}-arm64-usermode.msi
            out/release/${{ steps.version.outputs.version }}/OpenZFS-for-Windows-${{ steps.version.outputs.version }}-arm64.cdx.json
            out/release/${{ steps.version.outputs.version }}/zfswindows-test.cer
            out/release/${{ steps.version.outputs.version }}/VERSION.json
            out/release/${{ steps.version.outputs.version }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

      - name: Upload ARM64 Debug
        uses: actions/upload-artifact@v6
        with:
          name: OpenZFS-for-Windows-${{ steps.version.outputs.version }}-arm64-debug
          path: |
            out/release/${{ steps.version.outputs.version }}/OpenZFS-for-Windows-${{ steps.version.outputs.version }}-arm64-testsigned-debug.msi
            out/release/${{ steps.version.outputs.version }}/OpenZFS-for-Windows-${{ steps.version.outputs.version }}-arm64-usermode-debug.msi
            out/release/${{ steps.version.outputs.version }}/OpenZFS-for-Windows-${{ steps.version.outputs.version }}-arm64-debug.cdx.json
            out/release/${{ steps.version.outputs.version }}/zfswindows-test.cer
            out/release/${{ steps.version.outputs.version }}/VERSION.json
            out/release/${{ steps.version.outputs.version }}/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

  # x64 VM integration tests in the zfsTest VM, on the build's out\ (same
  # runner and workspace, so this checkout must not clean).  On demand only.
  vm-integration-x64:
    name: VM integration tests (x64)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.vm-integration-tests }}
    runs-on: [self-hosted, Windows, X64, zfswin-x64]
    timeout-minutes: 600
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false

      - name: x64 user-mode VM integration tests
        run: scripts\ci\Invoke-CiSuite.ps1 -Platform x64 -Edition usermode -Configuration $env:CONFIGURATION -Version ${{ needs.build.outputs.version }}

      - name: x64 kernel VM integration tests
        if: ${{ !cancelled() }}
        run: scripts\ci\Invoke-CiSuite.ps1 -Platform x64 -Edition kernel -Configuration $env:CONFIGURATION -Version ${{ needs.build.outputs.version }}

  # ARM64 VM integration tests in the ZFSTestOnArm VM, on the ARM PC; in
  # parallel with vm-integration-x64.  On demand only.
  vm-integration-arm64:
    name: VM integration tests (ARM64)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.vm-integration-tests }}
    runs-on: [self-hosted, Windows, ARM64, zfswin-arm64]
    timeout-minutes: 300
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v5
        with:
          clean: true

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          name: OpenZFS-for-Windows-${{ needs.build.outputs.version }}-arm64-${{ inputs.configuration == 'Debug' && 'debug' || 'release' }}
          path: artifact

      - name: Place packages
        run: |
          $v = '${{ needs.build.outputs.version }}'
          New-Item -ItemType Directory -Force "out\release\$v", "out\driver-package" | Out-Null
          Get-ChildItem artifact -Recurse -Filter *.msi | Copy-Item -Destination "out\release\$v"
          Get-ChildItem artifact -Recurse -Filter zfswindows-test.cer | Copy-Item -Destination "out\driver-package"

      - name: ARM64 user-mode VM integration tests
        run: scripts\ci\Invoke-CiSuite.ps1 -Platform arm64 -Edition usermode -Configuration $env:CONFIGURATION -Version ${{ needs.build.outputs.version }}

      - name: ARM64 kernel VM integration tests
        if: ${{ !cancelled() }}
        run: scripts\ci\Invoke-CiSuite.ps1 -Platform arm64 -Edition kernel -Configuration $env:CONFIGURATION -Version ${{ needs.build.outputs.version }}

  # The ARM64 unit tests on the ARM PC itself (no VM), with the engine the
  # build job cross-compiled.  On demand only.
  unit-tests-arm64:
    name: Unit tests (ARM64)
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.arm64-unit-tests }}
    runs-on: [self-hosted, Windows, ARM64, zfswin-arm64]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v5
        with:
          clean: true

      - name: Download engine
        uses: actions/download-artifact@v7
        with:
          name: unit-test-engine-arm64-${{ needs.build.outputs.version }}
          path: out/openzfs-write-${{ needs.build.outputs.test-configuration == 'Release' && 'release' || 'debug' }}-arm64/zfs-um-test

      - name: Unit tests (ARM64)
        run: scripts\test-usermode.ps1 -Architecture arm64 -Configuration ${{ needs.build.outputs.test-configuration }}

      - name: Upload ARM64 unit test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: unit-test-results-arm64-${{ needs.build.outputs.version }}
          path: out/test-results/usermode-arm64-${{ needs.build.outputs.test-configuration == 'Release' && 'release' || 'debug' }}
          if-no-files-found: ignore

  # A push to master (a merged pull request) is published as the GitHub
  # release v<version> with every package of the build: Release and Debug,
  # x64 and ARM64, the SBOMs, SHA256SUMS, VERSION.json and the test
  # certificate.  The README links to releases/latest.  The notes list the
  # pull requests merged since the previous release.
  release:
    name: GitHub release
    needs: build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: [self-hosted, Windows, X64, zfswin-x64]
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      # The workspace is shared with build, so no checkout; only the
      # previous run's downloaded packages are dropped.
      - name: Clean
        run: if (Test-Path out\github-release) { Remove-Item -Recurse -Force out\github-release }

      - name: Download packages
        uses: actions/download-artifact@v7
        with:
          pattern: OpenZFS-for-Windows-${{ needs.build.outputs.version }}-*
          path: out/github-release
          merge-multiple: true

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: OpenZFS for Windows ${{ needs.build.outputs.version }}
          body: |
            Install one package for your architecture (x64 or ARM64):
            - `…-usermode.msi`: OpenZFS in a Windows service through [WinFsp](https://github.com/winfsp/winfsp) 2.1+; Secure Boot stays on.
            - `…-testsigned.msi`: the kernel driver; test signing on, Secure Boot off, `zfswindows-test.cer` trusted. Test machines only.

            Files ending in `-debug` are the Debug build (unoptimized, full debug checks) for diagnosing problems. Verify downloads against `SHA256SUMS`, then follow [docs/installation.md](https://github.com/${{ github.repository }}/blob/v${{ needs.build.outputs.version }}/docs/installation.md).
          files: out/github-release/*
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true

  # Unit test coverage: the engine built instrumented (clang source-based
  # coverage, out\openzfs-write-coverage, never packaged), the unit tests on
  # it, the summary as this job's summary page and the HTML report as the
  # coverage-html artifact.  Same runner and workspace as build, so this
  # checkout must not clean.  On every push to master and on demand.
  coverage:
    name: Coverage (x64)
    needs: build
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.coverage) }}
    runs-on: [self-hosted, Windows, X64, zfswin-x64]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v5
        with:
          clean: false

      - name: Instrumented engine
        run: scripts\build-write-core.ps1 -Targets zfs-um-test -Architecture x64 -Configuration Release -Coverage

      - name: Unit tests with coverage
        run: scripts\test-usermode.ps1 -Coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-html-${{ needs.build.outputs.version }}
          path: out/coverage/html
          if-no-files-found: ignore
